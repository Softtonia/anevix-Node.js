name: Deploy Anevix API

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: anevix-api-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ============================================================
  # SERVER / APPLICATION
  # ============================================================
  DEPLOY_HOST: "185.131.53.137"
  DEPLOY_PORT: "2222"
  DEPLOY_USER: "deploy"

  DEPLOY_BASE_PATH: "/var/www/api.anevix.in"
  APP_HOST: "api.anevix.in"
  APP_URL: "https://api.anevix.in"

  NODE_PORT: "3101"
  PM2_APP_NAME: "anevix-api"
  HEALTH_PATH: "/"

  # ============================================================
  # POSTMAN
  # Workspace:
  # 42f2b257-2d72-44e6-a4dc-0b8ba613f1a2
  #
  # Collection UID:
  # 40673074-219bffd2-5145-42ed-8329-1311ac7411da
  #
  # Active Environment UID:
  # 40673074-bc557625-2851-431f-bb44-9514a657712b
  # ============================================================
  POSTMAN_WORKSPACE_ID: "42f2b257-2d72-44e6-a4dc-0b8ba613f1a2"
  POSTMAN_COLLECTION_ID: "40673074-219bffd2-5145-42ed-8329-1311ac7411da"
  POSTMAN_ENVIRONMENT_ID: "40673074-bc557625-2851-431f-bb44-9514a657712b"

jobs:

  # ============================================================
  # CI
  # ============================================================

  test:
    name: Node.js CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Verify Project
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          test -f package.json || {
              echo "::error::package.json is missing."
              exit 1
          }

          test -f package-lock.json || {
              echo "::error::package-lock.json is required."
              exit 1
          }

          node - <<'NODE'
          const pkg = require("./package.json");

          if (!pkg.scripts || !pkg.scripts.start) {
              console.error("ERROR: package.json must contain scripts.start");
              process.exit(1);
          }

          console.log("Start script:", pkg.scripts.start);

          if (pkg.scripts.build) {
              console.log("Build script:", pkg.scripts.build);
          } else {
              console.log("Build script: not defined; build step will be skipped.");
          }
          NODE

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev

      - name: Run Tests
        shell: bash
        run: |
          set -euo pipefail
          npm test --if-present

      - name: Build Application
        shell: bash
        run: |
          set -euo pipefail

          if node -e '
            const p = require("./package.json");
            process.exit(p.scripts && p.scripts.build ? 0 : 1);
          '; then
              npm run build
          else
              echo "No build script found. Skipping build."
          fi


  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    name: Deploy Anevix API
    needs:
      - test

    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Deployment ID
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"

          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "Deploy ID: $DEPLOY_ID"


      # ========================================================
      # SSH
      # ========================================================

      - name: Setup SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}

        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
              echo "::error::DEV_SSH_KEY repository secret is missing."
              exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
              | tr -d '\r' \
              > "$HOME/.ssh/anevix_deploy_key"

          chmod 600 "$HOME/.ssh/anevix_deploy_key"

          if ! ssh-keygen \
              -y \
              -f "$HOME/.ssh/anevix_deploy_key" \
              >/dev/null 2>&1
          then
              echo "::error::DEV_SSH_KEY is not a valid OpenSSH private key."
              exit 1
          fi

          HOST_KEY_FILE="$HOME/.ssh/anevix_host_key"

          rm -f "$HOST_KEY_FILE"

          KEYSCAN_OK=0

          for ATTEMPT in 1 2 3 4 5
          do
              echo "ssh-keyscan attempt ${ATTEMPT}/5"

              if ssh-keyscan \
                  -4 \
                  -T 10 \
                  -p "$DEPLOY_PORT" \
                  -t ed25519 \
                  "$DEPLOY_HOST" \
                  2>/dev/null \
                  > "$HOST_KEY_FILE"
              then
                  if [ -s "$HOST_KEY_FILE" ]; then
                      KEYSCAN_OK=1
                      break
                  fi
              fi

              sleep "$((ATTEMPT * 3))"
          done

          if [ "$KEYSCAN_OK" -ne 1 ]; then
              echo "::error::Unable to retrieve SSH host key."
              exit 1
          fi

          EXPECTED_FINGERPRINT="SHA256:9UPe5ZfQsWabEgPmXYRqZas3s7PEFS9e+kDqkgv2ans"

          ACTUAL_FINGERPRINT="$(
              ssh-keygen -lf "$HOST_KEY_FILE" \
                  | awk 'NR == 1 {print $2}'
          )"

          echo "Expected fingerprint: $EXPECTED_FINGERPRINT"
          echo "Actual fingerprint:   $ACTUAL_FINGERPRINT"

          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
              echo "::error::SSH host fingerprint mismatch."
              exit 1
          fi

          cp "$HOST_KEY_FILE" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat > "$HOME/.ssh/config" <<EOF
          Host anevix-dev
              HostName ${DEPLOY_HOST}
              Port ${DEPLOY_PORT}
              User ${DEPLOY_USER}
              IdentityFile ${HOME}/.ssh/anevix_deploy_key
              IdentitiesOnly yes
              BatchMode yes
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              StrictHostKeyChecking yes
              UserKnownHostsFile ${HOME}/.ssh/known_hosts
              ConnectTimeout 15
              ServerAliveInterval 15
              ServerAliveCountMax 3
          EOF

          chmod 600 "$HOME/.ssh/config"

          rm -f "$HOST_KEY_FILE"

          echo "SSH setup PASS"


      # ========================================================
      # SERVER PREFLIGHT
      # ========================================================

      - name: Server Preflight
        shell: bash
        run: |
          set -euo pipefail

          ssh anevix-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' NODE_PORT='$NODE_PORT' APP_URL_EXPECTED='$APP_URL' bash -s" <<'REMOTE'

          set -euo pipefail

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"

          echo "========================================"
          echo "ANEVIX SERVER PREFLIGHT"
          echo "========================================"

          echo "Base:    $BASE_PATH"
          echo "Current: $CURRENT_PATH"
          echo "Shared:  $SHARED_PATH"

          for COMMAND in \
              node \
              npm \
              pm2 \
              rsync \
              python3
          do
              if ! command -v "$COMMAND" >/dev/null 2>&1; then
                  echo "ERROR: Required command missing: $COMMAND"
                  exit 1
              fi
          done

          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "PM2:  $(pm2 --version)"

          test -f "$SHARED_PATH/.env" || {
              echo "ERROR: $SHARED_PATH/.env is missing."
              exit 1
          }

          test -r "$SHARED_PATH/.env" || {
              echo "ERROR: shared .env is not readable."
              exit 1
          }

          mkdir -p \
              "$CURRENT_PATH" \
              "$SHARED_PATH/logs" \
              "$SHARED_PATH/uploads"

          test -w "$CURRENT_PATH" || {
              echo "ERROR: current directory is not writable."
              exit 1
          }

          test -w "$SHARED_PATH" || {
              echo "ERROR: shared directory is not writable."
              exit 1
          }

          grep -q '^NODE_ENV=production$' "$SHARED_PATH/.env" || {
              echo "ERROR: NODE_ENV=production missing from shared .env"
              exit 1
          }

          grep -q '^HOST=127\.0\.0\.1$' "$SHARED_PATH/.env" || {
              echo "ERROR: HOST=127.0.0.1 missing from shared .env"
              exit 1
          }

          grep -q "^PORT=${NODE_PORT}$" "$SHARED_PATH/.env" || {
              echo "ERROR: PORT=${NODE_PORT} missing from shared .env"
              exit 1
          }

          grep -q "^APP_URL=${APP_URL_EXPECTED}$" "$SHARED_PATH/.env" || {
              echo "ERROR: APP_URL mismatch in shared .env"
              exit 1
          }

          echo "Server preflight PASS"

          REMOTE


      # ========================================================
      # UPLOAD
      # ========================================================

      - name: Upload Application
        shell: bash
        run: |
          set -euo pipefail

          RSYNC_OK=0

          for ATTEMPT in 1 2 3
          do
              echo "Rsync attempt ${ATTEMPT}/3"

              if rsync \
                  -az \
                  --delete-delay \
                  --delay-updates \
                  --partial \
                  --timeout=120 \
                  --no-owner \
                  --no-group \
                  --exclude="/.git/" \
                  --exclude="/.github/" \
                  --exclude="/.env" \
                  --exclude="/.env.*" \
                  --exclude="/node_modules/" \
                  --exclude="/logs/" \
                  --exclude="/uploads/" \
                  --exclude="/coverage/" \
                  --exclude="/docs/" \
                  --exclude="/README.md" \
                  -e "ssh -F $HOME/.ssh/config" \
                  ./ \
                  "anevix-dev:${DEPLOY_BASE_PATH}/current/"
              then
                  RSYNC_OK=1
                  echo "Upload PASS"
                  break
              fi

              if [ "$ATTEMPT" -lt 3 ]; then
                  sleep "$((ATTEMPT * 10))"
              fi
          done

          if [ "$RSYNC_OK" -ne 1 ]; then
              echo "::error::Application upload failed."
              exit 1
          fi


      # ========================================================
      # DEPLOY APPLICATION
      # ========================================================

      - name: Deploy Application
        shell: bash
        run: |
          set -euo pipefail

          ssh anevix-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' DEPLOY_ID='$DEPLOY_ID' NODE_PORT='$NODE_PORT' PM2_APP_NAME='$PM2_APP_NAME' bash -s" <<'REMOTE'

          set -euo pipefail

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"

          cd "$CURRENT_PATH"

          echo "========================================"
          echo "ANEVIX API DEPLOY"
          echo "========================================"

          echo "Deploy ID: $DEPLOY_ID"
          echo "Path:      $CURRENT_PATH"

          echo "========================================"

          test -f package.json || {
              echo "ERROR: package.json missing."
              exit 1
          }

          test -f package-lock.json || {
              echo "ERROR: package-lock.json missing."
              exit 1
          }

          node - <<'NODE'
          const pkg = require("./package.json");

          if (!pkg.scripts || !pkg.scripts.start) {
              console.error("ERROR: package.json must contain scripts.start");
              process.exit(1);
          }

          console.log("Start script:", pkg.scripts.start);
          NODE


          # ------------------------------------------------------
          # SHARED .ENV
          # ------------------------------------------------------

          if \
              [ -e "$CURRENT_PATH/.env" ] && \
              [ ! -L "$CURRENT_PATH/.env" ]
          then
              echo "ERROR: current/.env exists but is not a symlink."
              exit 1
          fi

          rm -f "$CURRENT_PATH/.env"

          ln -s \
              "$SHARED_PATH/.env" \
              "$CURRENT_PATH/.env"

          test -L "$CURRENT_PATH/.env" || {
              echo "ERROR: .env symlink failed."
              exit 1
          }

          test -r "$CURRENT_PATH/.env" || {
              echo "ERROR: .env is not readable."
              exit 1
          }

          echo ".env symlink PASS"


          # ------------------------------------------------------
          # PERSISTENT UPLOADS
          # ------------------------------------------------------

          mkdir -p "$SHARED_PATH/uploads"

          if \
              [ -e "$CURRENT_PATH/uploads" ] && \
              [ ! -L "$CURRENT_PATH/uploads" ]
          then
              echo "ERROR: current/uploads exists but is not a symlink."
              echo "Move existing uploads to shared/uploads first."
              exit 1
          fi

          rm -f "$CURRENT_PATH/uploads"

          ln -s \
              "$SHARED_PATH/uploads" \
              "$CURRENT_PATH/uploads"

          echo "uploads symlink PASS"


          # ------------------------------------------------------
          # INSTALL / BUILD
          # ------------------------------------------------------

          echo "Installing dependencies..."

          npm ci --include=dev

          echo "npm ci PASS"

          if node -e '
            const p = require("./package.json");
            process.exit(p.scripts && p.scripts.build ? 0 : 1);
          '; then
              echo "Building application..."
              npm run build
              echo "Build PASS"
          else
              echo "No build script found. Build skipped."
          fi

          echo "Pruning development dependencies..."

          npm prune --omit=dev

          echo "Production dependencies PASS"


          # ------------------------------------------------------
          # PM2
          # ------------------------------------------------------

          if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then

              echo "Reloading PM2 process..."

              pm2 reload "$PM2_APP_NAME" \
                  --update-env

          else

              echo "Starting PM2 process..."

              pm2 start npm \
                  --name "$PM2_APP_NAME" \
                  --cwd "$CURRENT_PATH" \
                  -- start

          fi

          pm2 save

          sleep 3

          pm2 describe "$PM2_APP_NAME"

          if ! pm2 pid "$PM2_APP_NAME" \
              | grep -Eq '^[1-9][0-9]*$'
          then
              echo "ERROR: PM2 process is not running."

              pm2 logs "$PM2_APP_NAME" \
                  --lines 100 \
                  --nostream \
                  || true

              exit 1
          fi

          echo "PM2 process PASS"


          # ------------------------------------------------------
          # LOCAL NODE HEALTH CHECK
          # ------------------------------------------------------

          echo "Checking Node application on 127.0.0.1:${NODE_PORT} ..."

          if ! python3 - "$NODE_PORT" <<'PY'
          import http.client
          import sys
          import time

          port = int(sys.argv[1])
          last_error = None

          for attempt in range(1, 6):
              connection = None

              try:
                  print(f"Local Node attempt {attempt}/5")

                  connection = http.client.HTTPConnection(
                      "127.0.0.1",
                      port,
                      timeout=10,
                  )

                  connection.request(
                      "GET",
                      "/",
                      headers={
                          "Accept": "application/json,text/plain,*/*",
                          "Connection": "close",
                      },
                  )

                  response = connection.getresponse()

                  body = response.read().decode(
                      "utf-8",
                      errors="replace",
                  )

                  print("Status:", response.status)
                  print("Body:", body[:500])

                  # Any HTTP response below 500 proves that the
                  # Node process is listening and serving HTTP.
                  if 100 <= response.status < 500:
                      print("Local Node health check PASS")
                      sys.exit(0)

                  raise RuntimeError(
                      f"Unexpected HTTP {response.status}"
                  )

              except Exception as exc:
                  last_error = exc

                  print(
                      "Attempt failed:",
                      repr(exc),
                  )

                  if attempt < 5:
                      time.sleep(attempt * 2)

              finally:
                  if connection is not None:
                      try:
                          connection.close()
                      except Exception:
                          pass

          print(
              "ERROR: Local Node health check failed: "
              + repr(last_error),
              file=sys.stderr,
          )

          sys.exit(1)
          PY
          then
              pm2 logs "$PM2_APP_NAME" \
                  --lines 100 \
                  --nostream \
                  || true

              exit 1
          fi


          # ------------------------------------------------------
          # DEPLOYMENT ID
          # ------------------------------------------------------

          printf '%s\n' \
              "$DEPLOY_ID" \
              > "$CURRENT_PATH/DEPLOY_ID"

          echo
          echo "========================================"
          echo "SERVER DEPLOYMENT SUCCESS"
          echo "========================================"

          echo "Deploy ID: $DEPLOY_ID"
          echo "Path:      $CURRENT_PATH"
          echo "PM2:       $PM2_APP_NAME"
          echo "Port:      $NODE_PORT"

          echo "========================================"

          REMOTE


      # ========================================================
      # PUBLIC HTTPS HEALTH CHECK
      # ========================================================

      - name: Verify Public HTTPS API
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$APP_HOST" "$HEALTH_PATH" <<'PY'
          import http.client
          import ssl
          import sys
          import time

          host = sys.argv[1]
          path = sys.argv[2]

          last_error = None

          for attempt in range(1, 6):
              connection = None

              try:
                  print(
                      f"Public HTTPS attempt {attempt}/5: "
                      f"https://{host}{path}"
                  )

                  connection = http.client.HTTPSConnection(
                      host,
                      443,
                      timeout=15,
                      context=ssl.create_default_context(),
                  )

                  connection.request(
                      "GET",
                      path,
                      headers={
                          "Accept": "application/json,text/plain,*/*",
                          "Connection": "close",
                      },
                  )

                  response = connection.getresponse()

                  body = response.read().decode(
                      "utf-8",
                      errors="replace",
                  )

                  print("HTTP status:", response.status)
                  print("Response:", body[:1000])

                  if 100 <= response.status < 500:
                      print("Public HTTPS API health check PASS")
                      sys.exit(0)

                  raise RuntimeError(
                      f"Unexpected HTTP {response.status}"
                  )

              except Exception as exc:
                  last_error = exc

                  print(
                      "Attempt failed:",
                      repr(exc),
                  )

                  if attempt < 5:
                      time.sleep(attempt * 3)

              finally:
                  if connection is not None:
                      try:
                          connection.close()
                      except Exception:
                          pass

          print(
              "ERROR: Public HTTPS health check failed: "
              + repr(last_error),
              file=sys.stderr,
          )

          sys.exit(1)
          PY


      # ========================================================
      # FAILURE DIAGNOSTICS
      # ========================================================

      - name: Deployment Failure Diagnostics
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ ! -f "$HOME/.ssh/anevix_deploy_key" ]; then
              echo "SSH key unavailable. Remote diagnostics skipped."
              exit 0
          fi

          if [ ! -f "$HOME/.ssh/config" ]; then
              echo "SSH config unavailable. Remote diagnostics skipped."
              exit 0
          fi

          ssh anevix-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' PM2_APP_NAME='$PM2_APP_NAME' NODE_PORT='$NODE_PORT' bash -s" <<'REMOTE' \
            || true

          set +e

          CURRENT_PATH="$BASE_PATH/current"

          echo "========================================"
          echo "ANEVIX FAILURE DIAGNOSTICS"
          echo "========================================"

          echo
          echo "===== PM2 ====="
          pm2 list || true

          echo
          echo "===== PM2 PROCESS ====="
          pm2 describe "$PM2_APP_NAME" || true

          echo
          echo "===== PM2 LOGS ====="
          pm2 logs "$PM2_APP_NAME" \
              --lines 100 \
              --nostream \
              || true

          echo
          echo "===== PORT ====="
          ss -ltnp \
              | grep ":${NODE_PORT} " \
              || true

          echo
          echo "===== DEPLOY ID ====="
          cat "$CURRENT_PATH/DEPLOY_ID" \
              2>/dev/null \
              || true

          echo
          echo "===== DISK ====="
          df -h "$CURRENT_PATH" || true

          echo
          echo "===== MEMORY ====="
          free -h || true

          REMOTE

          exit 0


      # ========================================================
      # CLEANUP
      # ========================================================

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: |
          set +e

          rm -f \
              "$HOME/.ssh/anevix_deploy_key" \
              "$HOME/.ssh/anevix_host_key" \
              "$HOME/.ssh/known_hosts" \
              "$HOME/.ssh/config"

          exit 0


  # ============================================================
  # POSTMAN SYNC
  #
  # Uses the collection + active environment from the supplied
  # Postman share URL.
  #
  # Runs after successful deployment.
  # Completely separate from SSH/server deployment.
  # Postman failure never changes the deployment result.
  # ============================================================

  sync-postman:
    name: Sync Postman
    needs:
      - deploy

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Sync Collection And Environment
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "ANEVIX POSTMAN SYNC"
          echo "========================================"

          if [ -z "${POSTMAN_API_KEY:-}" ]; then
              echo "::warning::POSTMAN_API_KEY secret is missing."
              echo "Postman sync skipped."
              exit 0
          fi

          if ! command -v jq >/dev/null 2>&1; then
              echo "::warning::jq is unavailable."
              echo "Postman sync skipped."
              exit 0
          fi

          COLLECTION_FILE="$(
              find docs/postman \
                  -maxdepth 1 \
                  -type f \
                  -name '*.postman_collection.json' \
                  -print \
                  2>/dev/null \
                  | head -n 1
          )"

          ENVIRONMENT_FILE="$(
              find docs/postman \
                  -maxdepth 1 \
                  -type f \
                  -name '*.postman_environment.json' \
                  -print \
                  2>/dev/null \
                  | head -n 1
          )"

          SYNC_ERRORS=0


          normalize_postman_id()
          {
              local VALUE="$1"

              if [[ "$VALUE" =~ ^[0-9]+-([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$ ]]
              then
                  printf '%s' "${BASH_REMATCH[1]}"
              else
                  printf '%s' "$VALUE"
              fi
          }


          COLLECTION_ID="$(
              normalize_postman_id "$POSTMAN_COLLECTION_ID"
          )"

          ENVIRONMENT_ID="$(
              normalize_postman_id "$POSTMAN_ENVIRONMENT_ID"
          )"


          echo "Workspace ID:   $POSTMAN_WORKSPACE_ID"
          echo "Collection ID:  $COLLECTION_ID"
          echo "Environment ID: $ENVIRONMENT_ID"


          # ------------------------------------------------------
          # COLLECTION
          # ------------------------------------------------------

          if [ -z "$COLLECTION_FILE" ]; then

              echo "::warning::No *.postman_collection.json found under docs/postman."
              SYNC_ERRORS=1

          elif ! jq -e '
              type == "object"
              and (.info | type == "object")
              and (.info.name | type == "string")
              and (.item | type == "array")
          ' "$COLLECTION_FILE" >/dev/null
          then

              echo "::warning::Postman collection JSON is invalid."
              SYNC_ERRORS=1

          else

              COLLECTION_PAYLOAD="$RUNNER_TEMP/postman-collection-payload.json"
              COLLECTION_RESPONSE="$RUNNER_TEMP/postman-collection-response.json"

              jq \
                  '{collection: .}' \
                  "$COLLECTION_FILE" \
                  > "$COLLECTION_PAYLOAD"

              COLLECTION_STATUS="$(
                  curl \
                      --silent \
                      --show-error \
                      --connect-timeout 15 \
                      --max-time 90 \
                      --retry 3 \
                      --retry-delay 2 \
                      --output "$COLLECTION_RESPONSE" \
                      --write-out '%{http_code}' \
                      --request PUT \
                      "https://api.postman.com/collections/${COLLECTION_ID}" \
                      --header "X-Api-Key: ${POSTMAN_API_KEY}" \
                      --header "Content-Type: application/json" \
                      --data-binary "@${COLLECTION_PAYLOAD}"
              )"

              CURL_EXIT=$?

              echo "Collection HTTP status: ${COLLECTION_STATUS:-N/A}"

              if \
                  [ "$CURL_EXIT" -ne 0 ] || \
                  [ "$COLLECTION_STATUS" != "200" ]
              then
                  echo "::warning::Postman collection sync failed."

                  if [ -s "$COLLECTION_RESPONSE" ]; then
                      cat "$COLLECTION_RESPONSE"
                  fi

                  SYNC_ERRORS=1
              else
                  echo "Postman collection sync PASS"
              fi

          fi


          # ------------------------------------------------------
          # ENVIRONMENT
          # ------------------------------------------------------

          if [ -z "$ENVIRONMENT_FILE" ]; then

              echo "::warning::No *.postman_environment.json found under docs/postman."
              SYNC_ERRORS=1

          elif ! jq -e '
              type == "object"
              and (.name | type == "string")
              and (.values | type == "array")
          ' "$ENVIRONMENT_FILE" >/dev/null
          then

              echo "::warning::Postman environment JSON is invalid."
              SYNC_ERRORS=1

          else

              ENVIRONMENT_PAYLOAD="$RUNNER_TEMP/postman-environment-payload.json"
              ENVIRONMENT_RESPONSE="$RUNNER_TEMP/postman-environment-response.json"

              jq \
                  --arg baseUrl "$APP_URL" \
                  '
                  .values = (
                      (.values // [])
                      | map(
                          if .key == "base_url"
                          then .value = $baseUrl
                          else .
                          end
                      )
                  )
                  |
                  {
                      environment: {
                          name: .name,
                          values: .values
                      }
                  }
                  ' \
                  "$ENVIRONMENT_FILE" \
                  > "$ENVIRONMENT_PAYLOAD"

              ENVIRONMENT_STATUS="$(
                  curl \
                      --silent \
                      --show-error \
                      --connect-timeout 15 \
                      --max-time 90 \
                      --retry 3 \
                      --retry-delay 2 \
                      --output "$ENVIRONMENT_RESPONSE" \
                      --write-out '%{http_code}' \
                      --request PUT \
                      "https://api.postman.com/environments/${ENVIRONMENT_ID}" \
                      --header "X-Api-Key: ${POSTMAN_API_KEY}" \
                      --header "Content-Type: application/json" \
                      --data-binary "@${ENVIRONMENT_PAYLOAD}"
              )"

              CURL_EXIT=$?

              echo "Environment HTTP status: ${ENVIRONMENT_STATUS:-N/A}"

              if \
                  [ "$CURL_EXIT" -ne 0 ] || \
                  [ "$ENVIRONMENT_STATUS" != "200" ]
              then
                  echo "::warning::Postman environment sync failed."

                  if [ -s "$ENVIRONMENT_RESPONSE" ]; then
                      cat "$ENVIRONMENT_RESPONSE"
                  fi

                  SYNC_ERRORS=1
              else
                  echo "Postman environment sync PASS"
              fi

          fi


          echo
          echo "========================================"

          if [ "$SYNC_ERRORS" -eq 0 ]; then
              echo "POSTMAN SYNC SUCCESS"
          else
              echo "POSTMAN SYNC COMPLETED WITH WARNINGS"
              echo "Anevix deployment was NOT affected."
          fi

          echo "========================================"

          exit 0
