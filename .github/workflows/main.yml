name: Deploy Anevix API

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: anevix-api-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: "185.131.53.137"
  DEPLOY_PORT: "2222"
  DEPLOY_USER: "deploy"

  DEPLOY_BASE_PATH: "/var/www/api.anevix.in"
  APP_HOST: "api.anevix.in"
  APP_URL: "https://api.anevix.in"

  NODE_PORT: "3101"
  PM2_APP_NAME: "anevix-api"

  POSTMAN_WORKSPACE_ID: "42f2b257-2d72-44e6-a4dc-0b8ba613f1a2"
  POSTMAN_COLLECTION_ID: "40673074-219bffd2-5145-42ed-8329-1311ac7411da"
  POSTMAN_ENVIRONMENT_ID: "40673074-bc557625-2851-431f-bb44-9514a657712b"

jobs:

  deploy:
    name: Deploy Anevix API
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Create Deployment ID
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"

          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "Deploy ID: $DEPLOY_ID"


      - name: Setup SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
              echo "::error::DEV_SSH_KEY repository secret is missing."
              exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
              | tr -d '\r' \
              > "$HOME/.ssh/anevix_deploy_key"

          chmod 600 "$HOME/.ssh/anevix_deploy_key"

          if ! ssh-keygen \
              -y \
              -f "$HOME/.ssh/anevix_deploy_key" \
              >/dev/null 2>&1
          then
              echo "::error::DEV_SSH_KEY is not a valid OpenSSH private key."
              exit 1
          fi

          HOST_KEY_FILE="$HOME/.ssh/anevix_host_key"

          KEYSCAN_OK=0

          for ATTEMPT in 1 2 3 4 5
          do
              if ssh-keyscan \
                  -4 \
                  -T 10 \
                  -p "$DEPLOY_PORT" \
                  -t ed25519 \
                  "$DEPLOY_HOST" \
                  2>/dev/null \
                  > "$HOST_KEY_FILE"
              then
                  if [ -s "$HOST_KEY_FILE" ]; then
                      KEYSCAN_OK=1
                      break
                  fi
              fi

              sleep "$((ATTEMPT * 3))"
          done

          if [ "$KEYSCAN_OK" -ne 1 ]; then
              echo "::error::Unable to retrieve SSH host key."
              exit 1
          fi

          EXPECTED_FINGERPRINT="SHA256:9UPe5ZfQsWabEgPmXYRqZas3s7PEFS9e+kDqkgv2ans"

          ACTUAL_FINGERPRINT="$(
              ssh-keygen -lf "$HOST_KEY_FILE" \
                  | awk 'NR == 1 {print $2}'
          )"

          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
              echo "::error::SSH host fingerprint mismatch."
              echo "Expected: $EXPECTED_FINGERPRINT"
              echo "Actual:   $ACTUAL_FINGERPRINT"
              exit 1
          fi

          cp "$HOST_KEY_FILE" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat > "$HOME/.ssh/config" <<EOF
          Host anevix-dev
              HostName ${DEPLOY_HOST}
              Port ${DEPLOY_PORT}
              User ${DEPLOY_USER}
              IdentityFile ${HOME}/.ssh/anevix_deploy_key
              IdentitiesOnly yes
              BatchMode yes
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              StrictHostKeyChecking yes
              UserKnownHostsFile ${HOME}/.ssh/known_hosts
              ConnectTimeout 15
              ServerAliveInterval 15
              ServerAliveCountMax 3
          EOF

          chmod 600 "$HOME/.ssh/config"

          rm -f "$HOST_KEY_FILE"

          echo "SSH setup PASS"


      - name: Server Preflight
        shell: bash
        run: |
          set -euo pipefail

          ssh anevix-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' bash -s" <<'REMOTE'

          set -euo pipefail

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"

          for COMMAND in node npm pm2 rsync python3
          do
              if ! command -v "$COMMAND" >/dev/null 2>&1; then
                  echo "ERROR: Required command missing: $COMMAND"
                  exit 1
              fi
          done

          mkdir -p \
              "$CURRENT_PATH" \
              "$SHARED_PATH/logs" \
              "$SHARED_PATH/uploads"

          test -w "$CURRENT_PATH" || {
              echo "ERROR: $CURRENT_PATH is not writable."
              exit 1
          }

          if [ ! -f "$SHARED_PATH/.env" ]; then
              echo "Shared .env not found. Creating placeholder."
              touch "$SHARED_PATH/.env"
              chmod 640 "$SHARED_PATH/.env"
          fi

          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "PM2:  $(pm2 --version)"
          echo "Server preflight PASS"

          REMOTE


      - name: Upload Application
        shell: bash
        run: |
          set -euo pipefail

          rsync \
              -az \
              --delete-delay \
              --delay-updates \
              --partial \
              --timeout=120 \
              --no-owner \
              --no-group \
              --exclude="/.git/" \
              --exclude="/.github/" \
              --exclude="/.env" \
              --exclude="/.env.*" \
              --exclude="/node_modules/" \
              --exclude="/logs" \
              --exclude="/uploads" \
              --exclude="/coverage/" \
              --exclude="/docs/" \
              -e "ssh -F $HOME/.ssh/config" \
              ./ \
              "anevix-dev:${DEPLOY_BASE_PATH}/current/"

          echo "Upload PASS"


      - name: Install And Deploy
        shell: bash
        run: |
          set -euo pipefail

          ssh anevix-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' DEPLOY_ID='$DEPLOY_ID' NODE_PORT='$NODE_PORT' PM2_APP_NAME='$PM2_APP_NAME' bash -s" <<'REMOTE'

          set -euo pipefail

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"

          cd "$CURRENT_PATH"

          test -f package.json || {
              echo "ERROR: package.json missing."
              exit 1
          }

          test -f package-lock.json || {
              echo "ERROR: package-lock.json missing."
              exit 1
          }


          # ------------------------------------------------------
          # Shared .env
          # ------------------------------------------------------

          if [ -e "$CURRENT_PATH/.env" ] && [ ! -L "$CURRENT_PATH/.env" ]; then
              echo "ERROR: current/.env exists but is not a symlink."
              exit 1
          fi

          rm -f "$CURRENT_PATH/.env"

          ln -s \
              "$SHARED_PATH/.env" \
              "$CURRENT_PATH/.env"


          # ------------------------------------------------------
          # Persistent uploads
          # ------------------------------------------------------

          mkdir -p "$SHARED_PATH/uploads"

          if [ -e "$CURRENT_PATH/uploads" ] && [ ! -L "$CURRENT_PATH/uploads" ]; then
              echo "ERROR: current/uploads exists but is not a symlink."
              exit 1
          fi

          rm -f "$CURRENT_PATH/uploads"

          ln -s \
              "$SHARED_PATH/uploads" \
              "$CURRENT_PATH/uploads"


          # ------------------------------------------------------
          # Install / optional build
          # ------------------------------------------------------

          npm ci --include=dev

          npm run build --if-present

          npm prune --omit=dev

          echo "Dependencies PASS"


          # ------------------------------------------------------
          # Production entry
          # ------------------------------------------------------

          ENTRY_FILE="$(
              node -p '
              const p = require("./package.json");
              p.main || "server.js";
              '
          )"

          test -f "$ENTRY_FILE" || {
              echo "ERROR: Production entry file missing: $ENTRY_FILE"
              exit 1
          }

          echo "Production entry: $ENTRY_FILE"


          # ------------------------------------------------------
          # Runtime environment readiness
          #
          # Missing runtime secrets do NOT fail deployment.
          # Fill shared/.env later and rerun the workflow.
          # ------------------------------------------------------

          RUNTIME_READY=1

          for VAR_NAME in MONGO_URL JWT_SECRET
          do
              if ! grep -Eq "^${VAR_NAME}=.+$" "$SHARED_PATH/.env"; then
                  echo "::warning::${VAR_NAME} is not configured yet."
                  RUNTIME_READY=0
              fi
          done

          if [ "$RUNTIME_READY" -ne 1 ]; then

              echo
              echo "========================================"
              echo "CODE DEPLOYED - APP START SKIPPED"
              echo "========================================"
              echo "Files and dependencies are deployed."
              echo "Runtime .env is not complete yet."
              echo "Fill:"
              echo "$SHARED_PATH/.env"
              echo "Then rerun this workflow."
              echo "Existing PM2 process, if any, was not changed."
              echo "========================================"

              printf '%s\n' \
                  "$DEPLOY_ID" \
                  > "$CURRENT_PATH/DEPLOY_ID"

              exit 0

          fi


          # ------------------------------------------------------
          # PM2
          # ------------------------------------------------------

          PM2_CONFIG="$CURRENT_PATH/ecosystem.deploy.cjs"

          cat > "$PM2_CONFIG" <<EOF
          module.exports = {
            apps: [
              {
                name: "${PM2_APP_NAME}",
                cwd: "${CURRENT_PATH}",
                script: "${ENTRY_FILE}",
                instances: 1,
                exec_mode: "fork",
                autorestart: true,
                watch: false,
                time: true,
                max_memory_restart: "500M",
                env: {
                  NODE_ENV: "production",
                  HOST: "127.0.0.1",
                  PORT: "${NODE_PORT}"
                },
                out_file: "${SHARED_PATH}/logs/pm2-out.log",
                error_file: "${SHARED_PATH}/logs/pm2-error.log",
                merge_logs: true
              }
            ]
          };
          EOF

          pm2 startOrReload \
              "$PM2_CONFIG" \
              --only "$PM2_APP_NAME" \
              --update-env

          pm2 save

          sleep 4

          PM2_PID="$(
              pm2 pid "$PM2_APP_NAME" \
                  | tail -n 1 \
                  | tr -d '[:space:]'
          )"

          if ! [[ "$PM2_PID" =~ ^[1-9][0-9]*$ ]]; then
              echo "ERROR: PM2 process is not running."

              pm2 logs "$PM2_APP_NAME" \
                  --lines 100 \
                  --nostream \
                  || true

              exit 1
          fi

          echo "PM2 process PASS"


          # ------------------------------------------------------
          # Local health check
          # ------------------------------------------------------

          if ! python3 - "$NODE_PORT" <<'PY'
          import http.client
          import sys
          import time

          port = int(sys.argv[1])
          last_error = None

          for attempt in range(1, 7):
              conn = None

              try:
                  conn = http.client.HTTPConnection(
                      "127.0.0.1",
                      port,
                      timeout=10,
                  )

                  conn.request(
                      "GET",
                      "/",
                      headers={
                          "Accept": "application/json,text/plain,*/*",
                          "Connection": "close",
                      },
                  )

                  response = conn.getresponse()
                  body = response.read().decode(
                      "utf-8",
                      errors="replace",
                  )

                  print("Status:", response.status)
                  print("Body:", body[:500])

                  if 100 <= response.status < 500:
                      print("Local Node health check PASS")
                      sys.exit(0)

                  raise RuntimeError(
                      f"Unexpected HTTP {response.status}"
                  )

              except Exception as exc:
                  last_error = exc
                  print("Attempt failed:", repr(exc))

                  if attempt < 6:
                      time.sleep(attempt * 2)

              finally:
                  if conn is not None:
                      try:
                          conn.close()
                      except Exception:
                          pass

          print(
              "ERROR: Local Node health check failed: "
              + repr(last_error),
              file=sys.stderr,
          )

          sys.exit(1)
          PY
          then
              pm2 logs "$PM2_APP_NAME" \
                  --lines 100 \
                  --nostream \
                  || true

              exit 1
          fi


          printf '%s\n' \
              "$DEPLOY_ID" \
              > "$CURRENT_PATH/DEPLOY_ID"

          echo
          echo "========================================"
          echo "ANEVIX DEPLOYMENT SUCCESS"
          echo "========================================"
          echo "Domain:    https://api.anevix.in"
          echo "Path:      $CURRENT_PATH"
          echo "PM2:       $PM2_APP_NAME"
          echo "Port:      $NODE_PORT"
          echo "Deploy ID: $DEPLOY_ID"
          echo "========================================"

          REMOTE


      - name: Cleanup SSH
        if: always()
        shell: bash
        run: |
          set +e

          rm -f \
              "$HOME/.ssh/anevix_deploy_key" \
              "$HOME/.ssh/anevix_host_key" \
              "$HOME/.ssh/known_hosts" \
              "$HOME/.ssh/config"

          exit 0


  # ============================================================
  # POSTMAN
  # Non-blocking. Never fails the deployment.
  # ============================================================

  sync-postman:
    name: Sync Postman
    needs:
      - deploy

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        continue-on-error: true

      - name: Sync Collection And Environment
        shell: bash
        run: |
          set +e

          if [ -z "${POSTMAN_API_KEY:-}" ]; then
              echo "::warning::POSTMAN_API_KEY is missing. Postman sync skipped."
              exit 0
          fi

          COLLECTION_FILE="$(
              find docs/postman \
                  -maxdepth 1 \
                  -type f \
                  -name '*.postman_collection.json' \
                  -print \
                  2>/dev/null \
                  | head -n 1
          )"

          ENVIRONMENT_FILE="$(
              find docs/postman \
                  -maxdepth 1 \
                  -type f \
                  -name '*.postman_environment.json' \
                  -print \
                  2>/dev/null \
                  | head -n 1
          )"

          normalize_postman_id()
          {
              local VALUE="$1"

              if [[ "$VALUE" =~ ^[0-9]+-([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$ ]]
              then
                  printf '%s' "${BASH_REMATCH[1]}"
              else
                  printf '%s' "$VALUE"
              fi
          }

          COLLECTION_ID="$(
              normalize_postman_id "$POSTMAN_COLLECTION_ID"
          )"

          ENVIRONMENT_ID="$(
              normalize_postman_id "$POSTMAN_ENVIRONMENT_ID"
          )"

          if [ -n "$COLLECTION_FILE" ]; then

              COLLECTION_PAYLOAD="$RUNNER_TEMP/collection.json"

              jq \
                  '{collection: .}' \
                  "$COLLECTION_FILE" \
                  > "$COLLECTION_PAYLOAD"

              STATUS="$(
                  curl \
                      --silent \
                      --show-error \
                      --output /tmp/postman-collection-response.json \
                      --write-out '%{http_code}' \
                      --request PUT \
                      "https://api.postman.com/collections/${COLLECTION_ID}" \
                      --header "X-Api-Key: ${POSTMAN_API_KEY}" \
                      --header "Content-Type: application/json" \
                      --data-binary "@${COLLECTION_PAYLOAD}"
              )"

              if [ "$STATUS" = "200" ]; then
                  echo "Postman collection sync PASS"
              else
                  echo "::warning::Postman collection sync returned HTTP ${STATUS:-N/A}"
              fi

          else

              echo "::warning::Postman collection file not found under docs/postman."

          fi

          if [ -n "$ENVIRONMENT_FILE" ]; then

              ENVIRONMENT_PAYLOAD="$RUNNER_TEMP/environment.json"

              jq \
                  --arg baseUrl "$APP_URL" \
                  '
                  .values = (.values // [])
                  |
                  .values = (
                      if any(.values[]; .key == "base_url")
                      then
                          .values
                          | map(
                              if .key == "base_url"
                              then
                                  .value = $baseUrl
                                  | .enabled = true
                              else
                                  .
                              end
                          )
                      else
                          .values + [
                              {
                                  key: "base_url",
                                  value: $baseUrl,
                                  enabled: true
                              }
                          ]
                      end
                  )
                  |
                  {
                      environment: {
                          name: .name,
                          values: .values
                      }
                  }
                  ' \
                  "$ENVIRONMENT_FILE" \
                  > "$ENVIRONMENT_PAYLOAD"

              STATUS="$(
                  curl \
                      --silent \
                      --show-error \
                      --output /tmp/postman-environment-response.json \
                      --write-out '%{http_code}' \
                      --request PUT \
                      "https://api.postman.com/environments/${ENVIRONMENT_ID}" \
                      --header "X-Api-Key: ${POSTMAN_API_KEY}" \
                      --header "Content-Type: application/json" \
                      --data-binary "@${ENVIRONMENT_PAYLOAD}"
              )"

              if [ "$STATUS" = "200" ]; then
                  echo "Postman environment sync PASS"
              else
                  echo "::warning::Postman environment sync returned HTTP ${STATUS:-N/A}"
              fi

          else

              echo "::warning::Postman environment file not found under docs/postman."

          fi

          exit 0
