name: Deploy Anevix API

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: anevix-api-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ============================================================
  # SERVER / APPLICATION
  # ============================================================
  DEPLOY_HOST: "185.131.53.137"
  DEPLOY_PORT: "2222"
  DEPLOY_USER: "deploy"

  DEPLOY_BASE_PATH: "/var/www/api.anevix.in"
  APP_HOST: "api.anevix.in"
  APP_URL: "https://api.anevix.in"

  NODE_PORT: "3101"
  PM2_APP_NAME: "anevix-api"
  NODE_RUNTIME_VERSION: "24.20.0"

  # ============================================================
  # POSTMAN
  # ============================================================
  POSTMAN_WORKSPACE_ID: "42f2b257-2d72-44e6-a4dc-0b8ba613f1a2"
  POSTMAN_COLLECTION_ID: "40673074-219bffd2-5145-42ed-8329-1311ac7411da"
  POSTMAN_ENVIRONMENT_ID: "40673074-bc557625-2851-431f-bb44-9514a657712b"

jobs:

  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    name: Deploy Anevix API
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Create Deployment ID
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"

          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "Deploy ID: $DEPLOY_ID"


      # ========================================================
      # SSH
      # ========================================================

      - name: Setup SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
              echo "::error::DEV_SSH_KEY repository secret is missing."
              exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
              | tr -d '\r' \
              > "$HOME/.ssh/anevix_deploy_key"

          chmod 600 "$HOME/.ssh/anevix_deploy_key"

          if ! ssh-keygen \
              -y \
              -f "$HOME/.ssh/anevix_deploy_key" \
              >/dev/null 2>&1
          then
              echo "::error::DEV_SSH_KEY is not a valid OpenSSH private key."
              exit 1
          fi

          HOST_KEY_FILE="$HOME/.ssh/anevix_host_key"
          rm -f "$HOST_KEY_FILE"

          KEYSCAN_OK=0

          for ATTEMPT in 1 2 3 4 5
          do
              echo "ssh-keyscan attempt ${ATTEMPT}/5"

              if ssh-keyscan \
                  -4 \
                  -T 10 \
                  -p "$DEPLOY_PORT" \
                  -t ed25519 \
                  "$DEPLOY_HOST" \
                  2>/dev/null \
                  > "$HOST_KEY_FILE"
              then
                  if [ -s "$HOST_KEY_FILE" ]; then
                      KEYSCAN_OK=1
                      break
                  fi
              fi

              sleep "$((ATTEMPT * 3))"
          done

          if [ "$KEYSCAN_OK" -ne 1 ]; then
              echo "::error::Unable to retrieve SSH host key."
              exit 1
          fi

          EXPECTED_FINGERPRINT="SHA256:9UPe5ZfQsWabEgPmXYRqZas3s7PEFS9e+kDqkgv2ans"

          ACTUAL_FINGERPRINT="$(
              ssh-keygen -lf "$HOST_KEY_FILE" \
                  | awk 'NR == 1 {print $2}'
          )"

          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
              echo "::error::SSH host fingerprint mismatch."
              echo "Expected: $EXPECTED_FINGERPRINT"
              echo "Actual:   $ACTUAL_FINGERPRINT"
              exit 1
          fi

          cp "$HOST_KEY_FILE" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          cat > "$HOME/.ssh/config" <<EOF
          Host anevix-dev
              HostName ${DEPLOY_HOST}
              Port ${DEPLOY_PORT}
              User ${DEPLOY_USER}
              IdentityFile ${HOME}/.ssh/anevix_deploy_key
              IdentitiesOnly yes
              BatchMode yes
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              StrictHostKeyChecking yes
              UserKnownHostsFile ${HOME}/.ssh/known_hosts
              ConnectTimeout 15
              ServerAliveInterval 15
              ServerAliveCountMax 3
          EOF

          chmod 600 "$HOME/.ssh/config"

          rm -f "$HOST_KEY_FILE"

          echo "SSH setup PASS"


      # ========================================================
      # SERVER PREFLIGHT
      # ========================================================

      - name: Server Preflight
        shell: bash
        run: |
          set -euo pipefail

          ssh anevix-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' bash -s" <<'REMOTE'

          set -euo pipefail

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"

          for COMMAND in \
              rsync \
              python3
          do
              if ! command -v "$COMMAND" >/dev/null 2>&1; then
                  echo "ERROR: Required command missing: $COMMAND"
                  exit 1
              fi
          done

          mkdir -p \
              "$CURRENT_PATH" \
              "$SHARED_PATH/logs" \
              "$SHARED_PATH/uploads" \
              "$SHARED_PATH/runtime"

          test -w "$CURRENT_PATH" || {
              echo "ERROR: $CURRENT_PATH is not writable."
              exit 1
          }

          test -w "$SHARED_PATH" || {
              echo "ERROR: $SHARED_PATH is not writable."
              exit 1
          }

          if [ ! -f "$SHARED_PATH/.env" ]; then
              echo "Shared .env not found. Creating empty shared .env."
              touch "$SHARED_PATH/.env"
              chmod 640 "$SHARED_PATH/.env"
          fi

          echo "System Node (not used by Anevix runtime):"
          node --version 2>/dev/null || true

          echo "Server preflight PASS"

          REMOTE


      # ========================================================
      # ISOLATED NODE RUNTIME
      #
      # IMPORTANT:
      # Node is downloaded on the GitHub runner, NOT on the server.
      # This avoids exit 137 / OOM kills during server-side curl.
      # We use the official Linux .tar.gz build because gzip
      # extraction has a much smaller memory footprint than xz.
      # ========================================================

      - name: Detect Server Architecture
        shell: bash
        run: |
          set -euo pipefail

          SERVER_ARCH="$(
              ssh anevix-dev '
                  case "$(uname -m)" in
                      x86_64)
                          printf "x64"
                          ;;
                      aarch64|arm64)
                          printf "arm64"
                          ;;
                      *)
                          echo "Unsupported architecture: $(uname -m)" >&2
                          exit 1
                          ;;
                  esac
              '
          )"

          echo "NODE_SERVER_ARCH=$SERVER_ARCH" >> "$GITHUB_ENV"
          echo "Server architecture: $SERVER_ARCH"


      - name: Prepare Node Runtime On Runner
        shell: bash
        run: |
          set -euo pipefail

          NODE_PACKAGE="node-v${NODE_RUNTIME_VERSION}-linux-${NODE_SERVER_ARCH}"
          NODE_ARCHIVE="${NODE_PACKAGE}.tar.gz"

          NODE_DOWNLOAD_DIR="$RUNNER_TEMP/anevix-node-download"
          NODE_EXTRACT_DIR="$RUNNER_TEMP/anevix-node-extracted"

          rm -rf \
              "$NODE_DOWNLOAD_DIR" \
              "$NODE_EXTRACT_DIR"

          mkdir -p \
              "$NODE_DOWNLOAD_DIR" \
              "$NODE_EXTRACT_DIR"

          echo "Downloading Node ${NODE_RUNTIME_VERSION} on GitHub runner..."

          curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 300 \
              "https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}/${NODE_ARCHIVE}" \
              --output "$NODE_DOWNLOAD_DIR/$NODE_ARCHIVE"

          curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 60 \
              "https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}/SHASUMS256.txt" \
              --output "$NODE_DOWNLOAD_DIR/SHASUMS256.txt"

          (
              cd "$NODE_DOWNLOAD_DIR"

              grep \
                  " ${NODE_ARCHIVE}$" \
                  SHASUMS256.txt \
                  > SHASUMS256.node.txt

              test -s SHASUMS256.node.txt || {
                  echo "::error::Node checksum entry not found."
                  exit 1
              }

              sha256sum \
                  -c \
                  SHASUMS256.node.txt
          )

          echo "Extracting Node on GitHub runner..."

          tar \
              -xzf "$NODE_DOWNLOAD_DIR/$NODE_ARCHIVE" \
              -C "$NODE_EXTRACT_DIR"

          NODE_SOURCE="$NODE_EXTRACT_DIR/$NODE_PACKAGE"

          test -x "$NODE_SOURCE/bin/node" || {
              echo "::error::Extracted Node binary is missing."
              exit 1
          }

          ACTUAL_VERSION="$(
              "$NODE_SOURCE/bin/node" \
                  --version
          )"

          if [ "$ACTUAL_VERSION" != "v${NODE_RUNTIME_VERSION}" ]; then
              echo "::error::Runner Node archive version mismatch."
              echo "Expected: v${NODE_RUNTIME_VERSION}"
              echo "Actual:   $ACTUAL_VERSION"
              exit 1
          fi

          echo "NODE_PACKAGE=$NODE_PACKAGE" >> "$GITHUB_ENV"
          echo "NODE_SOURCE=$NODE_SOURCE" >> "$GITHUB_ENV"

          echo "Runner Node: $ACTUAL_VERSION"
          echo "Node runtime preparation PASS"


      - name: Upload Anevix Node Runtime
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_RUNTIME_ROOT="${DEPLOY_BASE_PATH}/shared/runtime"
          REMOTE_NODE_HOME="${REMOTE_RUNTIME_ROOT}/${NODE_PACKAGE}"

          echo "Uploading extracted Node runtime without server-side archive extraction..."

          ssh anevix-dev \
            "RUNTIME_ROOT='$REMOTE_RUNTIME_ROOT' NODE_HOME='$REMOTE_NODE_HOME' bash -s" <<'REMOTE'

          set -euo pipefail

          mkdir -p "$RUNTIME_ROOT"
          mkdir -p "$NODE_HOME"

          REMOTE

          # No -z compression:
          # keep server-side CPU/RAM usage as low as possible.
          rsync \
              -a \
              --delete \
              --partial \
              --timeout=180 \
              --no-owner \
              --no-group \
              -e "ssh -F $HOME/.ssh/config" \
              "$NODE_SOURCE/" \
              "anevix-dev:${REMOTE_NODE_HOME}/"

          ssh anevix-dev \
            "RUNTIME_ROOT='$REMOTE_RUNTIME_ROOT' NODE_HOME='$REMOTE_NODE_HOME' NODE_RUNTIME_VERSION='$NODE_RUNTIME_VERSION' bash -s" <<'REMOTE'

          set -euo pipefail

          NODE_LINK="$RUNTIME_ROOT/node-current"
          NODE_BIN="$NODE_HOME/bin/node"
          NPM_CLI="$NODE_HOME/lib/node_modules/npm/bin/npm-cli.js"

          test -x "$NODE_BIN" || {
              echo "ERROR: Uploaded Node binary is missing."
              exit 1
          }

          test -f "$NPM_CLI" || {
              echo "ERROR: Uploaded npm CLI is missing."
              exit 1
          }

          ACTUAL_NODE_VERSION="$(
              "$NODE_BIN" --version
          )"

          ACTUAL_NPM_VERSION="$(
              "$NODE_BIN" "$NPM_CLI" --version
          )"

          if [ "$ACTUAL_NODE_VERSION" != "v${NODE_RUNTIME_VERSION}" ]; then
              echo "ERROR: Uploaded Node version mismatch."
              echo "Expected: v${NODE_RUNTIME_VERSION}"
              echo "Actual:   $ACTUAL_NODE_VERSION"
              exit 1
          fi

          ln -sfn \
              "$NODE_HOME" \
              "$NODE_LINK"

          echo "Anevix Node: $ACTUAL_NODE_VERSION"
          echo "Anevix npm:  $ACTUAL_NPM_VERSION"
          echo "Anevix Node runtime upload PASS"

          REMOTE


      # ========================================================
      # RUNTIME ENVIRONMENT
      # ========================================================

      - name: Sync Runtime Environment
        shell: bash
        env:
          RUNTIME_MONGO_URL: ${{ secrets.MONGO_URL }}
          RUNTIME_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RUNTIME_EMAIL_USER: ${{ secrets.EMAIL_USER }}
          RUNTIME_EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          set -euo pipefail

          TEMP_ENV="$RUNNER_TEMP/anevix-runtime.env"
          : > "$TEMP_ENV"

          append_secret()
          {
              local KEY="$1"
              local VALUE="$2"

              if [ -n "$VALUE" ]; then
                  printf '%s=%s\n' "$KEY" "$VALUE" >> "$TEMP_ENV"
                  echo "${KEY}: configured"
              else
                  echo "::warning::${KEY} GitHub secret is missing; existing server value will be preserved."
              fi
          }

          append_secret "MONGO_URL" "${RUNTIME_MONGO_URL:-}"
          append_secret "JWT_SECRET" "${RUNTIME_JWT_SECRET:-}"
          append_secret "EMAIL_USER" "${RUNTIME_EMAIL_USER:-}"
          append_secret "EMAIL_PASSWORD" "${RUNTIME_EMAIL_PASSWORD:-}"

          chmod 600 "$TEMP_ENV"

          REMOTE_TEMP="/tmp/anevix-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"

          scp \
              -F "$HOME/.ssh/config" \
              "$TEMP_ENV" \
              "anevix-dev:${REMOTE_TEMP}"

          ssh anevix-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' NODE_PORT='$NODE_PORT' APP_URL_EXPECTED='$APP_URL' REMOTE_TEMP='$REMOTE_TEMP' bash -s" <<'REMOTE'

          set -euo pipefail

          SHARED_PATH="$BASE_PATH/shared"
          ENV_FILE="$SHARED_PATH/.env"

          mkdir -p "$SHARED_PATH"
          touch "$ENV_FILE"

          python3 - \
              "$ENV_FILE" \
              "$REMOTE_TEMP" \
              "$NODE_PORT" \
              "$APP_URL_EXPECTED" <<'PY'
          from pathlib import Path
          import sys

          env_path = Path(sys.argv[1])
          managed_path = Path(sys.argv[2])
          node_port = sys.argv[3]
          app_url = sys.argv[4]

          updates = {
              "NODE_ENV": "production",
              "HOST": "127.0.0.1",
              "PORT": node_port,
              "APP_URL": app_url,
          }

          if managed_path.exists():
              for raw in managed_path.read_text(encoding="utf-8").splitlines():
                  if not raw or raw.startswith("#") or "=" not in raw:
                      continue

                  key, value = raw.split("=", 1)

                  if key:
                      updates[key] = value

          existing_lines = (
              env_path.read_text(encoding="utf-8").splitlines()
              if env_path.exists()
              else []
          )

          output = []
          written = set()

          for line in existing_lines:
              stripped = line.strip()

              if stripped and not stripped.startswith("#") and "=" in line:
                  key = line.split("=", 1)[0].strip()

                  if key in updates:
                      if key not in written:
                          output.append(f"{key}={updates[key]}")
                          written.add(key)
                      continue

              output.append(line)

          for key, value in updates.items():
              if key not in written:
                  output.append(f"{key}={value}")

          env_path.write_text(
              "\n".join(output).rstrip() + "\n",
              encoding="utf-8",
          )
          PY

          rm -f "$REMOTE_TEMP"
          chmod 640 "$ENV_FILE"

          echo "Runtime environment sync PASS"

          for KEY in NODE_ENV HOST PORT APP_URL MONGO_URL JWT_SECRET EMAIL_USER EMAIL_PASSWORD
          do
              if grep -Eq "^${KEY}=.+$" "$ENV_FILE"; then
                  echo "${KEY}: PRESENT"
              else
                  echo "${KEY}: NOT SET"
              fi
          done

          REMOTE

          rm -f "$TEMP_ENV"


      # ========================================================
      # UPLOAD
      # ========================================================

      - name: Upload Application
        shell: bash
        run: |
          set -euo pipefail

          rsync \
              -az \
              --delete-delay \
              --delay-updates \
              --partial \
              --timeout=120 \
              --no-owner \
              --no-group \
              --exclude="/.git/" \
              --exclude="/.github/" \
              --exclude="/.env" \
              --exclude="/.env.*" \
              --exclude="/node_modules/" \
              --exclude="/logs" \
              --exclude="/uploads" \
              --exclude="/coverage/" \
              --exclude="/docs/" \
              -e "ssh -F $HOME/.ssh/config" \
              ./ \
              "anevix-dev:${DEPLOY_BASE_PATH}/current/"

          echo "Upload PASS"


      # ========================================================
      # INSTALL / DEPLOY
      # ========================================================

      - name: Install And Deploy
        shell: bash
        run: |
          set -euo pipefail

          ssh anevix-dev \
            "BASE_PATH='$DEPLOY_BASE_PATH' DEPLOY_ID='$DEPLOY_ID' NODE_PORT='$NODE_PORT' PM2_APP_NAME='$PM2_APP_NAME' bash -s" <<'REMOTE'

          set -euo pipefail

          CURRENT_PATH="$BASE_PATH/current"
          SHARED_PATH="$BASE_PATH/shared"

          NODE_HOME="$SHARED_PATH/runtime/node-current"
          NODE_BIN="$NODE_HOME/bin/node"
          NPM_CLI="$NODE_HOME/lib/node_modules/npm/bin/npm-cli.js"

          test -x "$NODE_BIN" || {
              echo "ERROR: Isolated Anevix Node runtime is missing."
              exit 1
          }

          test -f "$NPM_CLI" || {
              echo "ERROR: Isolated Anevix npm CLI is missing."
              exit 1
          }

          SYSTEM_PM2="$(
              command -v pm2 \
                  || true
          )"

          test -n "$SYSTEM_PM2" || {
              echo "ERROR: PM2 command is missing on server."
              exit 1
          }

          PM2_SCRIPT="$(
              readlink -f "$SYSTEM_PM2"
          )"

          test -f "$PM2_SCRIPT" || {
              echo "ERROR: PM2 script could not be resolved."
              exit 1
          }

          # Keep Anevix PM2 completely separate from other apps/users.
          export PM2_HOME="$HOME/.pm2-anevix"

          mkdir -p \
              "$PM2_HOME" \
              "$SHARED_PATH/logs"

          export PATH="$NODE_HOME/bin:$PATH"
          hash -r

          NODE_VERSION="$(
              "$NODE_BIN" --version
          )"

          NPM_VERSION="$(
              "$NODE_BIN" "$NPM_CLI" --version
          )"

          echo "Runtime Node: $NODE_VERSION"
          echo "Runtime npm:  $NPM_VERSION"
          echo "PM2 home:     $PM2_HOME"

          case "$NODE_VERSION" in
              v24.*)
                  ;;
              *)
                  echo "ERROR: Deployment is not using Anevix Node 24."
                  exit 1
                  ;;
          esac

          pm2_anevix()
          {
              "$NODE_BIN" \
                  "$PM2_SCRIPT" \
                  "$@"
          }

          cd "$CURRENT_PATH"

          test -f package.json || {
              echo "ERROR: package.json missing."
              exit 1
          }

          test -f package-lock.json || {
              echo "ERROR: package-lock.json missing."
              exit 1
          }


          # ------------------------------------------------------
          # Shared .env
          # ------------------------------------------------------

          if [ -e "$CURRENT_PATH/.env" ] && [ ! -L "$CURRENT_PATH/.env" ]; then
              echo "ERROR: current/.env exists but is not a symlink."
              exit 1
          fi

          rm -f "$CURRENT_PATH/.env"

          ln -s \
              "$SHARED_PATH/.env" \
              "$CURRENT_PATH/.env"


          # ------------------------------------------------------
          # Persistent uploads
          # ------------------------------------------------------

          mkdir -p "$SHARED_PATH/uploads"

          if [ -e "$CURRENT_PATH/uploads" ] && [ ! -L "$CURRENT_PATH/uploads" ]; then
              echo "ERROR: current/uploads exists but is not a symlink."
              exit 1
          fi

          rm -f "$CURRENT_PATH/uploads"

          ln -s \
              "$SHARED_PATH/uploads" \
              "$CURRENT_PATH/uploads"


          # ------------------------------------------------------
          # Dependencies / optional build
          # ------------------------------------------------------

          "$NODE_BIN" "$NPM_CLI" ci --include=dev

          "$NODE_BIN" "$NPM_CLI" run build --if-present

          "$NODE_BIN" "$NPM_CLI" prune --omit=dev

          echo "Dependencies PASS"


          # ------------------------------------------------------
          # Production entry
          # ------------------------------------------------------

          ENTRY_FILE="$(
              "$NODE_BIN" -p '
              const p = require("./package.json");
              p.main || "server.js";
              '
          )"

          test -f "$ENTRY_FILE" || {
              echo "ERROR: Production entry file missing: $ENTRY_FILE"
              exit 1
          }

          echo "Production entry: $ENTRY_FILE"


          # ------------------------------------------------------
          # Runtime env readiness
          #
          # Missing secrets do NOT fail code deployment.
          # Fill shared/.env later and rerun workflow.
          # ------------------------------------------------------

          RUNTIME_READY=1

          for VAR_NAME in MONGO_URL JWT_SECRET
          do
              if ! grep -Eq "^${VAR_NAME}=.+$" "$SHARED_PATH/.env"; then
                  echo "::warning::${VAR_NAME} is not configured yet."
                  RUNTIME_READY=0
              fi
          done

          if [ "$RUNTIME_READY" -ne 1 ]; then

              printf '%s\n' \
                  "$DEPLOY_ID" \
                  > "$CURRENT_PATH/DEPLOY_ID"

              echo
              echo "========================================"
              echo "CODE DEPLOYED - APP START SKIPPED"
              echo "========================================"
              echo "Complete runtime values later in:"
              echo "$SHARED_PATH/.env"
              echo "Then rerun this workflow."
              echo "Existing PM2 process, if any, was not changed."
              echo "========================================"

              exit 0

          fi


          # ------------------------------------------------------
          # PM2
          #
          # Do not use ecosystem JSON/startOrReload here.
          # Direct process commands avoid PM2's _startJson path and
          # the "config.deploy" TypeError seen with PM2 7.
          # ------------------------------------------------------

          export NODE_ENV="production"
          export HOST="127.0.0.1"
          export PORT="$NODE_PORT"

          if pm2_anevix describe "$PM2_APP_NAME" >/dev/null 2>&1; then

              echo "Restarting existing Anevix PM2 process..."

              pm2_anevix restart \
                  "$PM2_APP_NAME" \
                  --update-env

          else

              if ss -ltn 2>/dev/null \
                  | grep -q ":${NODE_PORT} "
              then
                  echo "ERROR: Port ${NODE_PORT} is already in use."
                  echo "Refusing to stop an unknown process."
                  exit 1
              fi

              echo "Starting Anevix PM2 process..."

              pm2_anevix start \
                  "$CURRENT_PATH/$ENTRY_FILE" \
                  --name "$PM2_APP_NAME" \
                  --cwd "$CURRENT_PATH" \
                  --interpreter "$NODE_HOME/bin/node" \
                  --time \
                  --max-memory-restart 500M \
                  --output "$SHARED_PATH/logs/pm2-out.log" \
                  --error "$SHARED_PATH/logs/pm2-error.log"

          fi

          pm2_anevix save

          sleep 4

          PM2_PID="$(
              pm2_anevix pid "$PM2_APP_NAME" \
                  | tail -n 1 \
                  | tr -d '[:space:]'
          )"

          if ! [[ "$PM2_PID" =~ ^[1-9][0-9]*$ ]]; then

              echo "ERROR: PM2 process is not running."

              pm2_anevix logs "$PM2_APP_NAME" \
                  --lines 100 \
                  --nostream \
                  || true

              exit 1

          fi

          echo "PM2 PID: $PM2_PID"
          echo "PM2 process PASS"


          # ------------------------------------------------------
          # Local health check
          # ------------------------------------------------------

          if ! python3 - "$NODE_PORT" <<'PY'
          import http.client
          import sys
          import time

          port = int(sys.argv[1])
          last_error = None

          for attempt in range(1, 7):
              conn = None

              try:
                  conn = http.client.HTTPConnection(
                      "127.0.0.1",
                      port,
                      timeout=10,
                  )

                  conn.request(
                      "GET",
                      "/",
                      headers={
                          "Accept": "application/json,text/plain,*/*",
                          "Connection": "close",
                      },
                  )

                  response = conn.getresponse()
                  body = response.read().decode(
                      "utf-8",
                      errors="replace",
                  )

                  print("Status:", response.status)
                  print("Body:", body[:500])

                  if 100 <= response.status < 500:
                      print("Local Node health check PASS")
                      sys.exit(0)

                  raise RuntimeError(
                      f"Unexpected HTTP {response.status}"
                  )

              except Exception as exc:
                  last_error = exc
                  print("Attempt failed:", repr(exc))

                  if attempt < 6:
                      time.sleep(attempt * 2)

              finally:
                  if conn is not None:
                      try:
                          conn.close()
                      except Exception:
                          pass

          print(
              "ERROR: Local Node health check failed: "
              + repr(last_error),
              file=sys.stderr,
          )

          sys.exit(1)
          PY
          then
              pm2 logs "$PM2_APP_NAME" \
                  --lines 100 \
                  --nostream \
                  || true

              exit 1
          fi


          printf '%s\n' \
              "$DEPLOY_ID" \
              > "$CURRENT_PATH/DEPLOY_ID"

          echo
          echo "========================================"
          echo "ANEVIX DEPLOYMENT SUCCESS"
          echo "========================================"
          echo "Domain:    https://api.anevix.in"
          echo "Path:      $CURRENT_PATH"
          echo "PM2:       $PM2_APP_NAME"
          echo "Port:      $NODE_PORT"
          echo "Deploy ID: $DEPLOY_ID"
          echo "========================================"

          REMOTE


      # ========================================================
      # CLEANUP
      # ========================================================

      - name: Cleanup SSH
        if: always()
        shell: bash
        run: |
          set +e

          rm -f \
              "$HOME/.ssh/anevix_deploy_key" \
              "$HOME/.ssh/anevix_host_key" \
              "$HOME/.ssh/known_hosts" \
              "$HOME/.ssh/config"

          exit 0


  # ============================================================
  # POSTMAN SYNC
  #
  # Behavior:
  # - If repository collection file is missing:
  #   fetch it from Postman and add it to docs/postman.
  #
  # - If repository collection file already exists:
  #   update the existing Postman collection from the repo file.
  #
  # - If repository environment file is missing:
  #   create a SAFE template from the existing Postman environment.
  #   Secret/current values are NOT committed to Git.
  #
  # - Existing remote environment values are preserved.
  #   Only base_url is managed by this workflow.
  #
  # - Any newly created/updated repo Postman files are committed
  #   back to the current branch.
  #
  # - Postman failures never affect the application deployment.
  # ============================================================

  sync-postman:
    name: Sync Postman
    needs:
      - deploy

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      POSTMAN_API_BASE: "https://api.getpostman.com"

      POSTMAN_COLLECTION_FILE: "docs/Anevix-Postman-Collection.json"
      POSTMAN_ENVIRONMENT_FILE: "docs/Anevix-Postman-Environment.json"

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Sync Collection And Environment
        shell: bash
        continue-on-error: true
        run: |
          set +e

          echo "========================================"
          echo "ANEVIX POSTMAN SYNC"
          echo "========================================"

          if [ -z "${POSTMAN_API_KEY:-}" ]; then
              echo "::warning::POSTMAN_API_KEY is missing. Postman sync skipped."
              exit 0
          fi

          if ! command -v jq >/dev/null 2>&1; then
              echo "::warning::jq is unavailable. Postman sync skipped."
              exit 0
          fi

          mkdir -p docs/postman

          CHANGED_REPO_FILES=0


          # ------------------------------------------------------
          # Locate existing repo files
          # ------------------------------------------------------

          EXISTING_COLLECTION_FILE="$(
              find docs/postman \
                  -maxdepth 1 \
                  -type f \
                  -name '*.postman_collection.json' \
                  -print \
                  2>/dev/null \
                  | head -n 1
          )"

          EXISTING_ENVIRONMENT_FILE="$(
              find docs/postman \
                  -maxdepth 1 \
                  -type f \
                  -name '*.postman_environment.json' \
                  -print \
                  2>/dev/null \
                  | head -n 1
          )"

          if [ -n "$EXISTING_COLLECTION_FILE" ]; then
              COLLECTION_FILE="$EXISTING_COLLECTION_FILE"
          else
              COLLECTION_FILE="$POSTMAN_COLLECTION_FILE"
          fi

          if [ -n "$EXISTING_ENVIRONMENT_FILE" ]; then
              ENVIRONMENT_FILE="$EXISTING_ENVIRONMENT_FILE"
          else
              ENVIRONMENT_FILE="$POSTMAN_ENVIRONMENT_FILE"
          fi

          echo "Collection file:  $COLLECTION_FILE"
          echo "Environment file: $ENVIRONMENT_FILE"


          # ======================================================
          # COLLECTION
          # ======================================================

          if [ ! -f "$COLLECTION_FILE" ]; then

              echo "Collection file missing."
              echo "Fetching existing Postman collection..."

              COLLECTION_RESPONSE="$RUNNER_TEMP/postman-collection-get.json"

              COLLECTION_STATUS="$(
                  curl \
                      --silent \
                      --show-error \
                      --connect-timeout 15 \
                      --max-time 90 \
                      --retry 3 \
                      --retry-delay 2 \
                      --output "$COLLECTION_RESPONSE" \
                      --write-out '%{http_code}' \
                      --request GET \
                      "${POSTMAN_API_BASE}/collections/${POSTMAN_COLLECTION_ID}" \
                      --header "X-Api-Key: ${POSTMAN_API_KEY}"
              )"

              CURL_EXIT=$?

              echo "Collection GET status: ${COLLECTION_STATUS:-N/A}"

              if \
                  [ "$CURL_EXIT" -eq 0 ] && \
                  [ "$COLLECTION_STATUS" = "200" ] && \
                  jq -e '.collection | type == "object"' \
                      "$COLLECTION_RESPONSE" \
                      >/dev/null 2>&1
              then

                  jq '.collection' \
                      "$COLLECTION_RESPONSE" \
                      > "$COLLECTION_FILE"

                  CHANGED_REPO_FILES=1

                  echo "Collection added to repository workspace:"
                  echo "$COLLECTION_FILE"

              else

                  echo "::warning::Unable to fetch Postman collection."

                  if [ -s "$COLLECTION_RESPONSE" ]; then
                      cat "$COLLECTION_RESPONSE"
                  fi

              fi

          else

              echo "Collection file exists."
              echo "Updating existing Postman collection..."

              if jq -e '
                  type == "object"
                  and (.info | type == "object")
                  and (.item | type == "array")
              ' "$COLLECTION_FILE" >/dev/null 2>&1
              then

                  COLLECTION_PAYLOAD="$RUNNER_TEMP/postman-collection-put.json"
                  COLLECTION_RESPONSE="$RUNNER_TEMP/postman-collection-put-response.json"

                  jq \
                      '{collection: .}' \
                      "$COLLECTION_FILE" \
                      > "$COLLECTION_PAYLOAD"

                  COLLECTION_STATUS="$(
                      curl \
                          --silent \
                          --show-error \
                          --connect-timeout 15 \
                          --max-time 90 \
                          --retry 3 \
                          --retry-delay 2 \
                          --output "$COLLECTION_RESPONSE" \
                          --write-out '%{http_code}' \
                          --request PUT \
                          "${POSTMAN_API_BASE}/collections/${POSTMAN_COLLECTION_ID}" \
                          --header "X-Api-Key: ${POSTMAN_API_KEY}" \
                          --header "Content-Type: application/json" \
                          --data-binary "@${COLLECTION_PAYLOAD}"
                  )"

                  CURL_EXIT=$?

                  echo "Collection PUT status: ${COLLECTION_STATUS:-N/A}"

                  if \
                      [ "$CURL_EXIT" -eq 0 ] && \
                      [ "$COLLECTION_STATUS" = "200" ]
                  then
                      echo "Postman collection update PASS"
                  else
                      echo "::warning::Postman collection update failed."

                      if [ -s "$COLLECTION_RESPONSE" ]; then
                          cat "$COLLECTION_RESPONSE"
                      fi
                  fi

              else

                  echo "::warning::Repository collection JSON is invalid."

              fi

          fi


          # ======================================================
          # ENVIRONMENT
          #
          # Always read remote environment first so existing secret
          # values are preserved.
          # ======================================================

          REMOTE_ENV_RESPONSE="$RUNNER_TEMP/postman-environment-get.json"

          REMOTE_ENV_STATUS="$(
              curl \
                  --silent \
                  --show-error \
                  --connect-timeout 15 \
                  --max-time 90 \
                  --retry 3 \
                  --retry-delay 2 \
                  --output "$REMOTE_ENV_RESPONSE" \
                  --write-out '%{http_code}' \
                  --request GET \
                  "${POSTMAN_API_BASE}/environments/${POSTMAN_ENVIRONMENT_ID}" \
                  --header "X-Api-Key: ${POSTMAN_API_KEY}"
          )"

          CURL_EXIT=$?

          echo "Environment GET status: ${REMOTE_ENV_STATUS:-N/A}"

          if \
              [ "$CURL_EXIT" -eq 0 ] && \
              [ "$REMOTE_ENV_STATUS" = "200" ] && \
              jq -e '.environment | type == "object"' \
                  "$REMOTE_ENV_RESPONSE" \
                  >/dev/null 2>&1
          then

              # --------------------------------------------------
              # Create safe repo environment template if missing.
              #
              # All remote values are blanked before committing,
              # except base_url.
              # --------------------------------------------------

              if [ ! -f "$ENVIRONMENT_FILE" ]; then

                  echo "Environment file missing."
                  echo "Creating safe repository environment template..."

                  jq \
                      --arg baseUrl "$APP_URL" \
                      '
                      .environment
                      |
                      {
                          name: (.name // "Anevix"),
                          values: (
                              (.values // [])
                              | map({
                                  key: .key,
                                  value: (
                                      if .key == "base_url"
                                      then $baseUrl
                                      else ""
                                      end
                                  ),
                                  enabled: (.enabled // true),
                                  type: (.type // "default")
                              })
                          )
                      }
                      |
                      .values = (
                          if any(
                              .values[];
                              .key == "base_url"
                          )
                          then
                              .values
                          else
                              .values + [
                                  {
                                      key: "base_url",
                                      value: $baseUrl,
                                      enabled: true,
                                      type: "default"
                                  }
                              ]
                          end
                      )
                      ' \
                      "$REMOTE_ENV_RESPONSE" \
                      > "$ENVIRONMENT_FILE"

                  CHANGED_REPO_FILES=1

                  echo "Safe environment template added:"
                  echo "$ENVIRONMENT_FILE"

              else

                  # Keep repository base_url correct without touching
                  # other local template values.

                  ENV_TMP="$RUNNER_TEMP/postman-local-env-updated.json"

                  if jq -e '
                      type == "object"
                      and (.name | type == "string")
                      and (.values | type == "array")
                  ' "$ENVIRONMENT_FILE" >/dev/null 2>&1
                  then

                      jq \
                          --arg baseUrl "$APP_URL" \
                          '
                          .values = (
                              if any(
                                  .values[];
                                  .key == "base_url"
                              )
                              then
                                  .values
                                  | map(
                                      if .key == "base_url"
                                      then
                                          .value = $baseUrl
                                          | .enabled = true
                                      else
                                          .
                                      end
                                  )
                              else
                                  .values + [
                                      {
                                          key: "base_url",
                                          value: $baseUrl,
                                          enabled: true,
                                          type: "default"
                                      }
                                  ]
                              end
                          )
                          ' \
                          "$ENVIRONMENT_FILE" \
                          > "$ENV_TMP"

                      if ! cmp -s \
                          "$ENVIRONMENT_FILE" \
                          "$ENV_TMP"
                      then

                          mv \
                              "$ENV_TMP" \
                              "$ENVIRONMENT_FILE"

                          CHANGED_REPO_FILES=1

                          echo "Repository environment base_url updated."

                      else

                          rm -f "$ENV_TMP"

                      fi

                  else

                      echo "::warning::Repository environment JSON is invalid."

                  fi

              fi


              # --------------------------------------------------
              # Update ONLY base_url in remote environment.
              #
              # All existing remote values/secrets remain unchanged.
              # --------------------------------------------------

              REMOTE_ENV_PAYLOAD="$RUNNER_TEMP/postman-environment-put.json"
              REMOTE_ENV_PUT_RESPONSE="$RUNNER_TEMP/postman-environment-put-response.json"

              jq \
                  --arg baseUrl "$APP_URL" \
                  '
                  .environment
                  |
                  .values = (
                      if any(
                          (.values // [])[];
                          .key == "base_url"
                      )
                      then
                          (.values // [])
                          | map(
                              if .key == "base_url"
                              then
                                  .value = $baseUrl
                                  | .enabled = true
                              else
                                  .
                              end
                          )
                      else
                          (.values // []) + [
                              {
                                  key: "base_url",
                                  value: $baseUrl,
                                  enabled: true,
                                  type: "default"
                              }
                          ]
                      end
                  )
                  |
                  {
                      environment: {
                          name: .name,
                          values: .values
                      }
                  }
                  ' \
                  "$REMOTE_ENV_RESPONSE" \
                  > "$REMOTE_ENV_PAYLOAD"

              REMOTE_ENV_PUT_STATUS="$(
                  curl \
                      --silent \
                      --show-error \
                      --connect-timeout 15 \
                      --max-time 90 \
                      --retry 3 \
                      --retry-delay 2 \
                      --output "$REMOTE_ENV_PUT_RESPONSE" \
                      --write-out '%{http_code}' \
                      --request PUT \
                      "${POSTMAN_API_BASE}/environments/${POSTMAN_ENVIRONMENT_ID}" \
                      --header "X-Api-Key: ${POSTMAN_API_KEY}" \
                      --header "Content-Type: application/json" \
                      --data-binary "@${REMOTE_ENV_PAYLOAD}"
              )"

              CURL_EXIT=$?

              echo "Environment PUT status: ${REMOTE_ENV_PUT_STATUS:-N/A}"

              if \
                  [ "$CURL_EXIT" -eq 0 ] && \
                  [ "$REMOTE_ENV_PUT_STATUS" = "200" ]
              then
                  echo "Postman environment base_url update PASS"
              else
                  echo "::warning::Postman environment update failed."

                  if [ -s "$REMOTE_ENV_PUT_RESPONSE" ]; then
                      cat "$REMOTE_ENV_PUT_RESPONSE"
                  fi
              fi

          else

              echo "::warning::Unable to fetch Postman environment."

              if [ -s "$REMOTE_ENV_RESPONSE" ]; then
                  cat "$REMOTE_ENV_RESPONSE"
              fi

          fi


          # ======================================================
          # COMMIT NEW / UPDATED POSTMAN FILES TO REPO
          # ======================================================

          if [ "$CHANGED_REPO_FILES" -eq 1 ]; then

              echo
              echo "Repository Postman files changed."

              git config \
                  user.name \
                  "github-actions[bot]"

              git config \
                  user.email \
                  "41898282+github-actions[bot]@users.noreply.github.com"

              git add docs/postman

              if git diff \
                  --cached \
                  --quiet
              then

                  echo "Nothing to commit."

              else

                  git commit \
                      -m "chore(postman): sync Anevix Postman files"

                  if git push \
                      origin \
                      "HEAD:${GITHUB_REF_NAME}"
                  then

                      echo "Repository Postman files committed and pushed."

                  else

                      echo "::warning::Could not push Postman files back to branch."
                      echo "::warning::Check branch protection / workflow write permissions."

                  fi

              fi

          else

              echo "Repository Postman files already up to date."

          fi


          echo
          echo "========================================"
          echo "POSTMAN SYNC COMPLETE"
          echo "========================================"

          exit 0
